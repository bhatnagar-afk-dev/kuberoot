name: Feature request
description: Suggest an improvement or new capability
labels: ["kind/feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      placeholder: |
        - [ ] ...
  - type: markdown
    attributes:
      value: |
        Large features need a [design proposal](https://github.com/bhatnagar-afk-dev/kuberoot/tree/main/docs/proposals) before implementation.
