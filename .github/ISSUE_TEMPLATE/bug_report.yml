name: Bug report
description: Something isn't working as expected
labels: ["kind/bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KubeRoot version
      placeholder: v0.1.0 (shown in the status bar)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Kubernetes version and provider
      placeholder: e.g. 1.34, EKS / GKE / kind
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact any credentials or hostnames you don't want public.
      render: shell
