name: CI

# Thin caller: the jobs live in bhatnagar-afk-dev/build-publisher.
# PRs and pushes to main lint, test and build; pushing a `v*` tag also
# publishes the build archives to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual dry run: builds and packages the installers as artifacts, without
  # publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The other jobs are skipped (which counts as passing for required checks)
  # when only docs changed.
  changes:
    uses: bhatnagar-afk-dev/build-publisher/.github/workflows/detect-changes.yml@v1
    with:
      ignore-patterns: |
        docs/*
        *.md
        LICENSE
        .github/ISSUE_TEMPLATE/*
        .github/CODEOWNERS

  lint-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: bhatnagar-afk-dev/build-publisher/.github/workflows/go-ci.yml@v1
    with:
      node-version: "22"
      node-cache-dependency-path: frontend/package-lock.json
      apt-packages: libgtk-4-dev libwebkitgtk-6.0-dev
      go-tools: &wails3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      # main.go embeds frontend/dist, so it must exist before vet/lint/test.
      pre-commands: |
        npm ci --prefix frontend
        npm run build --prefix frontend
      test-command: go test -race -coverprofile=coverage.out ./...
      post-commands: |
        npm run check --prefix frontend
        wails3 generate bindings -clean=true -ts -i
        git diff --exit-code -- frontend/bindings || {
          echo "::error::frontend/bindings is stale. Run 'wails3 generate bindings -ts -i' and commit."
          exit 1
        }

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: bhatnagar-afk-dev/build-publisher/.github/workflows/kind-integration.yml@v1
    with:
      cluster-name: kuberoot
      test-command: KUBEROOT_IT_CONTEXT=kind-kuberoot go test -race -tags integration -run Integration -v ./internal/...

  build:
    needs: lint-test
    uses: bhatnagar-afk-dev/build-publisher/.github/workflows/build-native-app.yml@feat/release-packaging
    with:
      artifact-name: kuberoot
      artifact-path: bin/
      build-command: wails3 build
      node-version: "22"
      node-cache-dependency-path: frontend/package-lock.json
      apt-packages: libgtk-4-dev libwebkitgtk-6.0-dev
      go-tools: *wails3
      # Installers are built only for tags (published by `release`) and manual
      # dry runs, so PR and main CI stay fast. Asset names carry no version, so
      # releases/latest/download/<asset> links keep working across releases.
      release: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      release-archive: false
      versioned-asset-names: false
      # Stamp the tag's version into the build assets before packaging.
      package-command: bash hack/set-version.sh && wails3 task package
      # macOS: one universal (arm64 + amd64) app built on Apple Silicon, so
      # Intel Macs are covered without a separate (slow) Intel runner. The
      # .app is re-bundled after stamping so Info.plist has the version.
      runner-overrides: |
        [
          {"runner": "ubuntu-latest",
           "package-files": "bin/*.AppImage\nbin/*.deb\nbin/*.rpm"},
          {"runner": "windows-latest",
           "package-files": "bin/*-installer.exe"},
          {"runner": "macos-latest", "arch": "universal",
           "build-command": "wails3 task darwin:package:universal",
           "package-command": "bash hack/set-version.sh && wails3 task darwin:create:app:bundle && wails3 task darwin:create:dmg",
           "package-files": "bin/*.dmg"}
        ]

  release:
    needs: [build, integration]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: bhatnagar-afk-dev/build-publisher/.github/workflows/release-github.yml@v1
    with:
      artifact-name: kuberoot

  # Single required status check for branch protection. Calling a reusable
  # workflow prefixes its check names (e.g. "lint-test / Lint & test"), and a
  # skipped call reports only the caller job's name, so requiring individual
  # jobs is brittle. This passes when every job succeeded or was skipped.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint-test, integration, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = true ]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
